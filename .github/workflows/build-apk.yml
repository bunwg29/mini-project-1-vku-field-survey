name: Build and Release Android APK

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: |
          mkdir -p android/app/src/main/assets/public
          mkdir -p android/capacitor-cordova-android-plugins
          cp -r dist/* android/app/src/main/assets/public/
          npx cap sync android || npx cap copy android

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy and Rename APK
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/VKU-Field-Survey.apk

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VKU-Field-Survey-APK
          path: release-artifacts/VKU-Field-Survey.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0
          name: "VKU Field Survey - Android APK v1.0.0"
          body: |
            ## 📱 VKU Field Survey — Android Native APK (Capacitor)

            Ứng dụng khảo sát cơ sở vật chất ngoại tuyến tại Đại học Công nghệ Thông tin và Truyền thông Việt - Hàn (VKU).

            - **Sinh viên:** Trần Ka Bun (MSSV: 23IT.B015 — Lớp: 23SE4)
            - **Học phần:** Lập trình ứng dụng đa nền tảng (Cross-platform Mobile App Development)
            - **Live Demo Web (PWA):** [https://mini-project-1-vku-field-survey.vercel.app/](https://mini-project-1-vku-field-survey.vercel.app/)
            - **Công nghệ cốt lõi:** Vue 3, Vite, TypeScript, IndexedDB Offline Storage, Service Worker Cache-First, Capacitor 8 Native Plugins (Camera, Geolocation, Network), CI/CD Automated Build.

            ### ⬇️ Hướng dẫn cài đặt APK trên Android:
            1. Tải trực tiếp file **`VKU-Field-Survey.apk`** bên dưới.
            2. Cho phép cài đặt ứng dụng từ trình duyệt / tệp tin nếu điện thoại hiển thị cảnh báo bảo mật.
            3. Khởi chạy ứng dụng và cấp quyền Camera & GPS để trải nghiệm khảo sát hiện trường ngoại tuyến.
          files: |
            release-artifacts/VKU-Field-Survey.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
